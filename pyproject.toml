[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-trader-local"
version = "0.2.0"
description = "Local-first, server-less variant of eve-trader: embedded SQLite, single user, EVE SSO login."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    # Only used by refining/optimizer.py's linear program (scipy.optimize.linprog,
    # HiGHS) - a deliberate exception to this repo's otherwise dependency-light
    # discipline: hand-rolling a simplex solver is notoriously easy to get subtly
    # wrong, and this is exactly what scipy exists for. numpy comes along with it.
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# PySide6, not PyQt6: same Qt bindings, but LGPL rather than GPL/commercial -
# the right license for a tool that may eventually be packaged and
# redistributed as a binary (see ROADMAP.md's Stage 2 update mechanism).
gui = ["PySide6>=6.7", "qtawesome>=1.3"]
# Only needed to build the packaged executable (see packaging/eve-trader-local.spec
# and .github/workflows/build-windows.yml) - never a runtime dependency of the
# app itself, so it's its own extra rather than folded into `gui`.
build = ["pyinstaller>=6.0"]

[project.scripts]
eve-trader-local = "eve_trader_local.cli:main"
eve-trader-local-gui = "eve_trader_local.gui.main:main"

[tool.setuptools.packages.find]
include = ["eve_trader_local*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "release: frozen Production/Special-Order semantic-freeze regression (see PRODUCTION_SEMANTICS.md)",
]
